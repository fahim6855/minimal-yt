<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Minimal UI — less scrolling, more living.">
  <title>Minimal Youtube</title>

  <!-- Black-and-white Minimal YouTube favicon: M above the play mark. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0b'/%3E%3Ctext x='32' y='22' text-anchor='middle' font-family='Arial,sans-serif' font-size='19' font-weight='900' fill='white'%3EM%3C/text%3E%3Crect x='9' y='28' width='46' height='29' rx='9' fill='white'/%3E%3Cpath d='M28 35 L28 50 L41 42.5 Z' fill='%230b0b0b'/%3E%3C/svg%3E">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --panel: #151515;
      --panel-hover: #1d1d1d;
      --ink: #f5f5f5;
      --muted: #929292;
      --line: #292929;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 36px, 660px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      padding: 25px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark { width: 34px; height: 34px; display: block; }

    .brand-name {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.04em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 0 90px;
      transform: translateY(-12px);
    }

    .intro {
      margin: 0 0 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(39px, 8vw, 55px);
      line-height: 1;
      letter-spacing: -.075em;
      font-weight: 760;
    }

    .tagline {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .005em;
    }

    .search-card {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      transition: border-color .2s ease, background .2s ease;
    }

    .search-card:focus-within {
      border-color: #555;
      background: #181818;
    }

    form { display: flex; align-items: center; gap: 8px; }

    .search-icon {
      width: 20px;
      height: 20px;
      margin-left: 10px;
      flex: 0 0 auto;
      color: #888;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 7px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    input::placeholder { color: #777; }

    button {
      height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      background: #f2f2f2;
      color: #101010;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s ease, transform .15s ease;
    }

    button:hover { background: #dcdcdc; }
    button:active { transform: scale(.98); }

    button:focus-visible, input:focus-visible {
      outline: 2px solid #aaa;
      outline-offset: 3px;
    }

    footer {
      padding: 20px 0 25px;
      color: #777;
      text-align: center;
      font-size: 11px;
      letter-spacing: .025em;
    }

    @media (max-width: 480px) {
      .page { width: min(100% - 28px, 660px); }
      header { padding: 20px 0; }
      main { padding: 35px 0 70px; transform: translateY(-8px); }
      .search-card { padding: 6px; }
      input { height: 46px; font-size: 13px; }
      button { height: 44px; padding: 0 15px; }
      .search-icon { margin-left: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="Minimal UI home">
        <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="Minimal YouTube logo">
          <text x="32" y="22" text-anchor="middle"
                font-family="Arial, sans-serif" font-size="19" font-weight="900" fill="#fff">M</text>
          <rect x="9" y="28" width="46" height="29" rx="9" fill="#fff"/>
          <path d="M28 35 L28 50 L41 42.5 Z" fill="#0b0b0b"/>
        </svg>
        <span class="brand-name">minimal YT LITE</span>
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">minimal Youtube Lite</h1>
        <p class="tagline">Less scrolling. More living.</p>
      </section>

      <section aria-label="YouTube search">
        <div class="search-card">
          <form id="search-form" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/>
              <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input
              id="search-input"
              type="search"
              name="q"
              placeholder="Search YouTube..."
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="false"
              aria-label="Search YouTube videos"
              required
            >
            <button type="submit">Search ↗</button>
          </form>
        </div>
      </section>
    </main>

    <footer>Made for intentional watching.</footer>
  </div>

  <script>
    "use strict";

    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query) {
        input.focus();
        return;
      }
      const url = "https://www.youtube.com/results?search_query=" +
                  encodeURIComponent(query);
      window.location.assign(url);
    });
  </script>
</body>
</html>
